<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game platform · Builder</title>
  <link rel="stylesheet" href="/static/common.css?v=6" />
  <link rel="stylesheet" href="/static/builder.css?v=11" />
</head>
<body>
<div class="app builder-shell">
  <aside class="sidebar">
    <div class="app-brand"><span class="app-brand-mark" aria-hidden="true">✳</span><span class="app-brand-name">Game Builder</span></div>
    <nav class="app-nav" aria-label="Game platform"><a href="/portal">Play</a><a href="/builder" aria-current="page">Build</a></nav>
    <button id="new-game" type="button" class="primary">+ New game</button>
    <div class="library-label">Your games</div><div id="games"></div>
    <div class="sidebar-footer"><div id="account-menu"></div></div>
  </aside>
  <main class="work builder-main">
    <section id="welcome" class="starter-card"><h1>Game Builder</h1><p>Make a game, play it, and keep improving it.</p><button id="welcome-action" type="button" class="primary">Sign in</button></section>
    <div id="workspace" hidden>
      <section id="starter-view" class="starter-card"><h1>Create a game</h1><p>Describe the game you want to play. AI handles the rules and player counts.</p><div id="starter-agent-home">
        <div id="agent-tools">
          <div id="agent-log" role="log" aria-label="AI conversation" hidden></div>
          <div id="agent-activity" role="status" aria-live="polite" hidden><progress aria-label="Waiting for server response"></progress><strong id="agent-phase"></strong><span id="agent-elapsed"></span><p id="agent-wait-note"></p></div>
          <label class="sr-only" for="agent-input">Describe a game or change</label>
          <textarea id="agent-input" rows="4" placeholder="Describe the game you want to play…"></textarea>
          <div class="agent-actions"><button id="agent-send" class="primary" type="button">Create game</button><button id="agent-stop" type="button" hidden>Stop waiting</button></div>
          <div id="agent-message" class="message" role="status"></div>
        </div>
      </div></section>
      <section id="play-view" hidden>
        <div class="workspace-heading"><div class="game-heading"><label class="sr-only" for="game-name">Game name</label><input id="game-name" aria-label="Game name" placeholder="Untitled game" /><span id="game-version"></span></div><button id="publish" class="primary" type="button">Publish</button></div>
        <div class="workspace-meta"><span id="save-status" role="status"></span><button id="retry-save" type="button" hidden>Retry autosave</button><a id="play-game" href="/portal" hidden>Play online ↗</a></div>
        <p id="game-summary"></p>
        <div class="play-toolbar"><label for="play-mode" class="sr-only">Play mode</label><select id="play-mode" aria-label="Play mode"></select><button id="restart" type="button">Restart</button><button id="undo-move" type="button">Undo move</button><span class="toolbar-spacer"></span><button id="undo-ai-change" type="button">Undo AI change</button></div>
        <div id="test-frame" class="frame-box"></div><div id="test-status" class="message" role="status"></div>
        <details class="game-history"><summary>Version history</summary><div id="version-history" class="history-controls"><label class="sr-only" for="versions">Published version</label><select id="versions" aria-label="Published version"></select><button id="load-version" type="button">Load version</button></div><button id="delete-game" type="button" class="danger">Delete game</button></details>
        <div id="workspace-message" class="message" role="status"></div>
      </section>
    </div>
  </main>
</div>
<aside id="ai-panel" aria-label="AI game assistant" hidden>
  <div class="ai-panel-heading"><button id="ai-drag-handle" type="button" aria-label="Move AI panel" title="Drag to move. Arrow keys move the panel when focused.">✳ AI assistant <span aria-hidden="true">⠿</span></button><button id="close-ai" type="button" aria-label="Close AI assistant">×</button></div>
  <div id="ai-panel-body"></div>
</aside>
<button id="open-ai" type="button" hidden>Ask AI</button>
<script src="/static/common.js?v=4"></script><script src="/static/auth.js?v=1"></script><script src="/static/builder.js?v=21"></script>
</body>
</html>
